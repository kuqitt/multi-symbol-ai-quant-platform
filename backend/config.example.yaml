exchange: okx
env: paper
market_type: spot
simulation:
  starting_balance: 1000.0
  fee_rate: 0.0004
  use_live_market_data: true
  max_slippage_multiplier: 2.0
  max_spread_multiplier: 1.5
  reset_account_on_start: false
symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
timeframe: 1m
strategy:
  ma_fast: 5
  ma_slow: 20
  rsi_period: 14
  rsi_buy_threshold: 55.0
  rsi_sell_threshold: 45.0
  atr_period: 14
  stop_loss_atr_multiple: 1.5
  take_profit_atr_multiple: 2.5
strategy_engine:
  enabled_strategies:
    - ma_rsi
    - trend_breakout
  selection_mode: weighted
  strategy_weights:
    ma_rsi: 1.0
    trend_breakout: 0.8
  minimum_confidence: 0.55
regime:
  enabled: true
  trend_lookback: 30
  trend_strength_threshold: 0.015
  high_volatility_threshold: 0.035
  low_volatility_threshold: 0.008
  confidence_floor: 0.55
signal:
  min_signal_score: 0.58
  ai_weight: 0.15
  regime_weight: 0.2
  momentum_weight: 0.35
  mean_reversion_weight: 0.2
  breakout_weight: 0.25
  sell_score_buffer: 0.02
allocation:
  enabled: true
  base_risk_budget: 1.0
  min_notional_ratio: 0.05
  max_notional_ratio: 0.2
  max_concurrent_positions: 5
  regime_multipliers:
    trending_up: 1.15
    trending_down: 0.85
    range: 0.75
    volatile: 0.6
    unknown: 0.5
cost_model:
  enabled: true
  taker_fee_bps: 4.0
  slippage_spread_weight: 0.6
  impact_weight: 0.25
  max_cost_bps: 35.0
optimization:
  enable_grid_search: true
  walk_forward_train_bars: 180
  walk_forward_test_bars: 60
  parameter_grid:
    ma_fast: [5, 8, 10]
    ma_slow: [20, 30, 40]
    rsi_buy_threshold: [52, 55, 58]
    rsi_sell_threshold: [42, 45, 48]
risk:
  risk_per_trade: 0.005
  max_daily_loss: 0.02
  max_symbol_exposure: 0.2
  max_total_exposure: 0.6
  max_strategy_exposure: 0.35
  max_portfolio_heat: 0.03
  max_consecutive_losses: 3
  max_slippage: 0.002
  max_spread: 0.003
execution:
  order_type: market
  retry_count: 2
approval:
  enabled: false
  require_manual_approval_for_live: true
  require_manual_approval_for_large_orders: true
  auto_approve_small_accounts: true
  auto_approve_below_equity: 1000.0
  approval_min_notional: 5000.0
  approval_timeout_seconds: 900
auth:
  access_token_ttl_minutes: 720
notifier:
  telegram_enabled: false
  feishu_enabled: false
  telegram_bot_token: ""
  telegram_chat_id: ""
  feishu_app_id: ""
  feishu_webhook_url: ""
  feishu_app_secret: ""
  feishu_receive_id: ""
  feishu_receive_id_type: chat_id
ui:
  refresh_interval_ms: 1000
  chart_points_limit: 500
logging:
  level: INFO
connectors:
  okx:
    base_url: https://www.okx.com
    public_ws_url: wss://ws.okx.com:8443/ws/v5/public
    demo_public_ws_url: wss://wspap.okx.com:8443/ws/v5/public
    demo_broker_id: "9999"
  binance:
    base_url: https://api.binance.com
    testnet_base_url: https://testnet.binance.vision
    public_ws_url: wss://stream.binance.com:9443/stream
    testnet_public_ws_url: wss://testnet.binance.vision/stream